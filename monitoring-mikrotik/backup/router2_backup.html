<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NETMON | CHR 2</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #000816;

    color:
        #d5dbe6;

}


.container {

    width: 90%;

    max-width: 1200px;

    margin:
        40px auto;

}


.header {

    margin-bottom: 30px;

}


.header h1 {

    font-size: 42px;

    margin-bottom: 10px;

}


.header p {

    color: #718096;

    font-size: 18px;

}


.card {

    border:
        1px solid #075486;

    border-radius: 15px;

    background:
        rgba(0,8,22,0.8);

    padding: 35px;

    margin-bottom: 30px;

}


h2 {

    color:
        #d5dbe6;

    margin-bottom: 30px;

}


table {

    width: 100%;

    border-collapse:
        collapse;

}


th {

    text-align: left;

    color:
        #00ff9d;

    padding: 18px;

    border-bottom:
        1px solid #12344d;

    font-size: 17px;

}


td {

    padding: 20px;

    border-bottom:
        1px solid #10263b;

    font-size: 17px;

}


.online {

    color:
        #00ff9d !important;

    font-weight:
        bold;

}


.offline {

    color:
        #ff5c5c !important;

    font-weight:
        bold;

}


.buttons {

    display: flex;

    gap: 15px;

    margin-top: 25px;

}


button {

    background:
        rgba(0,8,22,0.8);

    border:
        1px solid #075486;

    color:
        #00ff9d;

    padding:
        12px 22px;

    border-radius:
        8px;

    cursor:
        pointer;

    font-weight:
        bold;

}


button:hover {

    background:
        #00ff9d;

    color:
        #000816;

}


@media(max-width:650px) {

    .container {

        width: 95%;

    }

    .header h1 {

        font-size: 30px;

    }

    .card {

        padding: 20px;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
CHR 2
</h1>

<p>
MikroTik Router Monitoring - CHR 2
</p>

</div>



<div class="card">

<h2>
ROUTER DETAILS
</h2>


<table>

<tr>

<th>
Informasi
</th>

<th>
Nilai
</th>

</tr>


<tr>

<td>
Router Name
</td>

<td id="name">
-
</td>

</tr>


<tr>

<td>
IP Address
</td>

<td id="ip">
-
</td>

</tr>


<tr>

<td>
RouterOS Version
</td>

<td id="version">
-
</td>

</tr>


<tr>

<td>
CPU Usage
</td>

<td id="cpu">
-
</td>

</tr>


<tr>

<td>
Memory Usage
</td>

<td id="memory">
-
</td>

</tr>


<tr>

<td>
Uptime
</td>

<td id="uptime">
-
</td>

</tr>


<tr>

<td>
Interface
</td>

<td id="interface">
-
</td>

</tr>


<tr>

<td>
Status
</td>

<td id="status">
-
</td>

</tr>

</table>


<div class="buttons">

<button
onclick="location.href='/'">
KEMBALI KE DASHBOARD
</button>


<button
onclick="location.href='/chr1'">
BUKA CHR 1
</button>

</div>

</div>

</div>



<script>

async function updateCHR2() {

    try {

        const response =
            await fetch("/api/status");

        const data =
            await response.json();

        const router =
            data.routers["CHR 2"];


        document.getElementById(
            "name"
        ).textContent =
            router.name || "-";


        document.getElementById(
            "ip"
        ).textContent =
            router.ip || "-";


        document.getElementById(
            "version"
        ).textContent =
            router.version || "-";


        document.getElementById(
            "cpu"
        ).textContent =
            (router.cpu ?? 0) + "%";


        document.getElementById(
            "memory"
        ).textContent =
            (router.memory ?? 0) + "%";


        document.getElementById(
            "uptime"
        ).textContent =
            router.uptime || "-";


        document.getElementById(
            "interface"
        ).textContent =
            router.interface || "-";


        const status =
            document.getElementById(
                "status"
            );

        status.textContent =
            router.status || "OFFLINE";


        status.className =
            router.status === "ONLINE"
                ? "online"
                : "offline";

    }

    catch(error) {

        document.getElementById(
            "status"
        ).textContent =
            "API ERROR";

        document.getElementById(
            "status"
        ).className =
            "offline";

    }

}


updateCHR2();


setInterval(
    updateCHR2,
    3000
);

</script>


</body>

</html>
